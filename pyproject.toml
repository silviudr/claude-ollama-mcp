[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-mcp"
version = "0.1.0"
description = "MCP server that delegates coding tasks to a local Ollama model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # Upper bound is load bearing: mcp 2.0.0 removed mcp.server.fastmcp
    # entirely — the FastMCP class does not exist anywhere in that release —
    # so server.py and every @mcp.tool() decorator would need rewriting.
    # Unpinned, CI installs 2.x and every module importing the package fails
    # to collect. Raise this only alongside that migration.
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[project.scripts]
ollama-mcp = "ollama_mcp.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
