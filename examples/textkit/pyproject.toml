[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textkit"
version = "0.1.0"
description = "A minimal text manipulation library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
optional-dependencies = {dev = ["pytest>=8"]}

[tool.setuptools.packages.find]
where = ["src"]
